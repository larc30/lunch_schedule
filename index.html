<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀 점심 일정</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --grid:#d5d9df; --head:#f0f2f5;
    --text:#1f2329; --sub:#6b7280; --faint:#a3a9b3;
    --accent:#1f6feb;
    --good:#15803d; --good-mid:#86efac; --good-soft:#dcfce7;
    --warn:#a16207; --warn-soft:#fef3c7; --danger:#dc2626;
    --sun:#dc2626; --sat:#2563eb;
    --h1:#dbeafe; --h2:#93c5fd; --h3:#3b82f6; --h4:#1d4ed8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  a{color:var(--accent)}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px}

  /* 헤더 — 일반 */
  header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .bar1 .wrap{display:flex;align-items:center;gap:10px;height:56px}
  .brand{font-weight:700;font-size:17px;color:inherit;text-decoration:none;white-space:nowrap}
  .me{margin-left:auto;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 헤더 — 관리자 */
  body.admin{--bg:#eceef1}
  body.admin header{background:#1f2329;border-bottom:0;color:#fff}
  .mode{font-size:12px;font-weight:700;background:#fbbf24;color:#1f2329;border-radius:999px;padding:2px 9px;white-space:nowrap}
  .acct{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
  .acct .email{font-size:12px;color:#9ca3af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .logout{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:8px;padding:5px 12px;
    font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .logout:hover{background:rgba(255,255,255,.12)}
  .bar2{background:#2b3038}
  .bar2 .wrap{display:flex;height:40px}
  .bar2 a{color:#cbd5e1;text-decoration:none;font-size:14px;padding:0 12px;display:flex;align-items:center;
    border-bottom:2px solid transparent;white-space:nowrap}
  .bar2 a:first-child{margin-left:-12px}
  .bar2 a:hover{color:#fff}
  .bar2 a.on{color:#fff;border-bottom-color:#fbbf24;font-weight:600}
  .bar2 a.ext{margin-left:auto;margin-right:-12px;font-size:13px}
  footer{text-align:center;padding:0 16px 40px;font-size:12px}
  footer a{color:var(--faint);text-decoration:none}
  footer a:hover{color:var(--sub);text-decoration:underline}
  @media (max-width:480px){ .acct .email{display:none} .brand{font-size:15px} }

  main.wrap{padding-top:20px;padding-bottom:32px}
  .banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}
  .banner.err{background:#fee2e2;color:var(--danger)}
  .linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  h2{font-size:18px;margin:0 0 2px}
  h3{font-size:15px;margin:0 0 12px}
  .sub{color:var(--sub);font-size:13px}
  .muted{color:var(--sub)}
  .mt{margin-top:12px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .between{justify-content:space-between}
  .btn{display:inline-block;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:8px;
    padding:7px 14px;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;font-family:inherit}
  .btn:hover{border-color:#c9ced6}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:var(--danger)}
  .btn.sm{padding:4px 10px;font-size:13px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;font-family:inherit;color:var(--text)}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .lock{font-size:11px;margin-left:2px}
  .pinbox{margin-top:16px;padding:14px 16px;background:#f8f9fb;border:1px solid var(--line);border-radius:10px}
  .pin-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px}
  .pin-row input[type=password]{width:150px;letter-spacing:.25em}
  .me .linkbtn{font-weight:400;color:var(--sub);margin-left:6px}
  .badge{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle;font-weight:500}
  .badge.open{background:var(--good-soft);color:var(--good)}
  .badge.closed{background:#eef0f3;color:var(--sub)}
  .list-item{display:block;color:inherit;text-decoration:none}
  .list-item:hover{border-color:#c9ced6}
  .ok{color:var(--good)}
  input[type=text],input[type=email],input[type=password],textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--text);width:100%}
  textarea{min-height:150px;resize:vertical}
  label.f{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2329;color:#fff;padding:9px 16px;border-radius:8px;
    font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;max-width:calc(100% - 32px);text-align:center}
  .toast.show{opacity:1}

  /* 캘린더 */
  .cal-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
  .cal-title{font-weight:600;margin-bottom:6px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--grid);border-left:1px solid var(--grid);user-select:none;-webkit-user-select:none}
  .cal .h{font-size:12px;text-align:center;padding:4px 0;background:var(--head);border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);color:var(--sub)}
  .cal .h.sun{color:var(--sun)} .cal .h.sat{color:var(--sat)}
  .cell{appearance:none;border:0;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);border-radius:0;background:#fff;
    height:50px;padding:4px 6px;text-align:left;font:inherit;font-size:13px;position:relative;cursor:pointer;color:var(--text);display:block;width:100%}
  .cell .num{display:block;line-height:1.1}
  .cell.sun .num{color:var(--sun)} .cell.sat .num{color:var(--sat)}
  .cell.today .num{font-weight:700;text-decoration:underline}
  .cell.hol .num{color:var(--sun)}
  .cell .hn{display:block;font-size:10px;line-height:1.2;color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .cell.empty{background:#fafbfc;cursor:default}
  .cell.off{background:#f1f2f4;cursor:not-allowed}
  .cell.off .num{color:var(--faint)}
  .cell.off .hn{color:#e8a0a0}
  .cell.ro{cursor:default}
  .cell.on{background:var(--good-soft);box-shadow:inset 0 0 0 2px var(--good)}
  .cell.on::after{content:"✓";position:absolute;right:6px;bottom:3px;color:var(--good);font-weight:700}
  .cell:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
  .cell .cnt{position:absolute;right:6px;bottom:3px;font-weight:700;font-size:13px}
  .cell.h1{background:var(--h1)} .cell.h2{background:var(--h2)}
  .cell.h3{background:var(--h3);color:#fff} .cell.h4{background:var(--h4);color:#fff}
  .cell.h3 .num,.cell.h4 .num{color:#fff}
  .cell.h3 .hn,.cell.h4 .hn{color:#fee2e2}
  .cell.best{box-shadow:inset 0 0 0 3px var(--good)}
  .cell.best .num::after{content:" ★";color:var(--good)}
  .cell.h3.best .num::after,.cell.h4.best .num::after{color:var(--good-mid)}
  .cell.picked{outline:2px solid var(--text);outline-offset:-4px}
  .legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub);flex-wrap:wrap}
  .legend span{white-space:nowrap}
  .legend i{display:inline-block;width:16px;height:12px;border:1px solid var(--grid)}

  /* 관리자 */
  .ritem{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
  .ritem:first-child{border-top:none;padding-top:0}
  .ritem:last-child{padding-bottom:0}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .stat{background:#f8f9fb;border-radius:10px;padding:12px 14px}
  .stat .big{font-size:20px;font-weight:700;margin-top:2px}
  .pick{margin-top:12px;font-size:14px;background:#f8f9fb;border-radius:10px;padding:10px 14px}
  .pick:empty{display:none}

  /* 엑셀형 응답표 */
  .mx-wrap{overflow-x:auto;border:1px solid var(--grid);border-radius:8px}
  table.mx{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
  .mx th,.mx td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:6px 8px;text-align:center;white-space:nowrap;min-width:46px}
  .mx tr:last-child td{border-bottom:0}
  .mx th{background:var(--head);font-weight:600}
  .mx .dow{font-weight:400;font-size:11px;color:var(--sub)}
  .mx th.sun .dow{color:var(--sun)} .mx th.sat .dow{color:var(--sat)}
  .mx .nm{position:sticky;left:0;background:#fff;text-align:left;z-index:1;min-width:90px}
  .mx th.nm{background:var(--head)}
  .mx td.y{background:var(--good-soft);color:var(--good);font-weight:700}
  .mx th.best,.mx td.tot.best{background:var(--good-mid)}
  .mx tr.pending td{color:var(--faint)}
  .mx tr.foot td{background:#f8f9fb;font-weight:600}
  .mx tr.foot td.nm{background:#f8f9fb}
  .mx tr.mine td{font-weight:600}
  .mx tr.mine td.nm{background:#eef4ff}

  @media (max-width:560px){ .cell{height:44px} }
</style>
</head>
<body>
<header id="hd"></header>
<main class="wrap">
  <div id="banner"></div>
  <div id="view"><div class="card muted">불러오는 중…</div></div>
</main>
<footer id="ft"></footer>
<div class="toast" id="toast"></div>

<script type="module">
// ─────────────────────────────────────────────
// Firebase 설정 (콘솔 → 프로젝트 설정 → 내 앱에서 복사한 값)
// YOUR_API_KEY 그대로 두거나 주소 끝에 ?demo 를 붙이면 데모 모드(이 브라우저에만 저장)
// ─────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyCJKRE-MwNzivAdERjUG7ltET4il8b1VRw",
  authDomain: "lunch-schedule-950e5.firebaseapp.com",
  projectId: "lunch-schedule-950e5",
  storageBucket: "lunch-schedule-950e5.firebasestorage.app",
  messagingSenderId: "221079133111",
  appId: "1:221079133111:web:8ca61d0c57207515ffe632"
};

const DEMO = new URLSearchParams(location.search).has("demo") || !firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("YOUR_");
const $view = document.getElementById("view");
let userApi, adminApi, unsubs = [], handlers = {};
let adminUser = null, adminReady = false;
// 일반 사용자 신원: 로그인한 PIN 계정(uid) + 이름별 PIN 계정 목록(accounts) → 내 이름(me)
const ident = {uid:undefined, accounts:null, me:null, sig:"", subs:new Set(),
  get ready(){return this.uid!==undefined&&this.accounts!==null}};

// ── 유틸 ──────────────────────────────────────
const W = "일월화수목금토";
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function parseYmd(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function todayStr(){return ymd(new Date())}
function fmtDate(s){const d=parseYmd(s);return `${d.getMonth()+1}/${d.getDate()} (${W[d.getDay()]})`}
function fmtDT(ts){const d=new Date(ts);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}
// 평일(주말·공휴일 제외)
function weekdays(start,end){const out=[];for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const s=ymd(d);if(d.getDay()>0&&d.getDay()<6&&!KR_HOLIDAYS[s])out.push(s)}return out}
function monthsBetween(a,b){
  const out=[];let y=+a.slice(0,4),m=+a.slice(5,7)-1;const ey=+b.slice(0,4),em=+b.slice(5,7)-1;
  while(y<ey||(y===ey&&m<=em)){out.push([y,m]);if(++m>11){m=0;y++}}
  return out;
}
function clone(o){return JSON.parse(JSON.stringify(o))}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),Math.max(1800,msg.length*70))}
function lsGet(k){try{return localStorage.getItem(k)}catch{return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch{}}
async function copy(text){
  try{await navigator.clipboard.writeText(text)}
  catch{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}
  toast("복사했어요");
}
function roundUrl(id){return `${location.origin}${location.pathname}#/r/${encodeURIComponent(id)}`}
function datesOf(r){return (r?.items?.date||[]).slice().sort()}
function dateSummary(r){const ds=datesOf(r);return ds.length?`${fmtDate(ds[0])} ~ ${fmtDate(ds[ds.length-1])} · 후보 ${ds.length}일`:"후보 없음"}
function badge(r){return `<span class="badge ${r.status}">${r.status==="open"?"진행중":"마감"}</span>`}
function mailText(r){
  return `[팀점심] ${r.title} 가능 날짜 체크 부탁드립니다.\n\n아래 링크에서 본인 이름을 고르고 PIN 6자리를 입력한 뒤(처음이면 PIN을 새로 정해요), 캘린더에서 가능한 날짜를 모두 눌러 저장해 주세요.\n${roundUrl(r.id)}\n\n후보 기간: ${dateSummary(r)}`;
}
function showError(msg){document.getElementById("banner").innerHTML=`<div class="banner err">${esc(msg)}</div>`}
function fmtTime(ts){const d=new Date(ts);return [d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,"0")).join(":")}
function syncText(ts){return ts?`자동 갱신 중 · 마지막 ${fmtTime(ts)}`:""}

// ── 집계·응답표 (일반 현황과 관리자 결과 공용) ─
function summarize(round,members,responses){
  const dates=datesOf(round);
  const rows=[...members,...Object.keys(responses).filter(n=>!members.includes(n))];
  const heat={};dates.forEach(d=>heat[d]=0);
  Object.values(responses).forEach(r=>(r.picks?.date||[]).forEach(d=>{if(d in heat)heat[d]++}));
  const max=Math.max(0,...Object.values(heat));
  const best=new Set(max>0?dates.filter(d=>heat[d]===max):[]);
  const top=dates.filter(d=>heat[d]>0).sort((a,b)=>heat[b]-heat[a]||a.localeCompare(b)).slice(0,3);
  return {dates,rows,heat,best,top,responded:members.filter(m=>responses[m]).length,pending:members.filter(m=>!responses[m])};
}
function topText(s){return s.top.length?`${fmtDate(s.top[0])} · ${s.heat[s.top[0]]}명`:"-"}
function matrixHtml(s,responses,me){
  if(!s.dates.length)return `<span class="muted">후보 날짜가 없어요.</span>`;
  const head=s.dates.map(d=>{const w=parseYmd(d).getDay();
    return `<th class="${w===0?"sun":w===6?"sat":""} ${s.best.has(d)?"best":""}">${fmtDate(d).split(" ")[0]}<div class="dow">${W[w]}</div></th>`}).join("");
  const body=s.rows.map(n=>{const r=responses[n],p=new Set(r?.picks?.date||[]);
    return `<tr class="${r?"":"pending"}${n===me?" mine":""}"><td class="nm">${esc(n)}${n===me?` <span class="sub">(나)</span>`:""}${r?"":` <span class="sub">미응답</span>`}</td>
      ${s.dates.map(d=>`<td class="${p.has(d)?"y":""}">${p.has(d)?"●":""}</td>`).join("")}
      <td>${r?p.size:"-"}</td></tr>`}).join("");
  const foot=`<tr class="foot"><td class="nm">가능 인원</td>${s.dates.map(d=>`<td class="tot ${s.best.has(d)?"best":""}">${s.heat[d]}</td>`).join("")}<td></td></tr>`;
  return `<div class="mx-wrap"><table class="mx"><thead><tr><th class="nm">이름</th>${head}<th>계</th></tr></thead><tbody>${body}${foot}</tbody></table></div>`;
}

// ── 한국 공휴일 ───────────────────────────────
// 2026~2027: 인사혁신처 발표 기준(노동절·제헌절 공휴일, 대체공휴일 포함) 내장
// 2028년 이후: date.nager.at에서 자동 조회(보조용 — 대체·임시공휴일이 빠질 수 있음)
const KR_HOLIDAYS={
  "2026-01-01":"신정","2026-02-16":"설날 연휴","2026-02-17":"설날","2026-02-18":"설날 연휴",
  "2026-03-01":"삼일절","2026-03-02":"대체공휴일","2026-05-01":"노동절","2026-05-05":"어린이날",
  "2026-05-24":"부처님오신날","2026-05-25":"대체공휴일","2026-06-03":"지방선거","2026-06-06":"현충일",
  "2026-07-17":"제헌절","2026-08-15":"광복절","2026-08-17":"대체공휴일",
  "2026-09-24":"추석 연휴","2026-09-25":"추석","2026-09-26":"추석 연휴",
  "2026-10-03":"개천절","2026-10-05":"대체공휴일","2026-10-09":"한글날","2026-12-25":"크리스마스",
  "2027-01-01":"신정","2027-02-06":"설날 연휴","2027-02-07":"설날","2027-02-08":"설날 연휴","2027-02-09":"대체공휴일",
  "2027-03-01":"삼일절","2027-05-01":"노동절","2027-05-03":"대체공휴일","2027-05-05":"어린이날","2027-05-13":"부처님오신날",
  "2027-06-06":"현충일","2027-07-17":"제헌절","2027-07-19":"대체공휴일","2027-08-15":"광복절","2027-08-16":"대체공휴일",
  "2027-09-14":"추석 연휴","2027-09-15":"추석","2027-09-16":"추석 연휴",
  "2027-10-03":"개천절","2027-10-04":"대체공휴일","2027-10-09":"한글날","2027-10-11":"대체공휴일",
  "2027-12-25":"크리스마스","2027-12-27":"대체공휴일"
};
const holidayYears=new Set([2026,2027]);
async function loadHolidays(years){
  let changed=false;
  await Promise.all(years.filter(y=>!holidayYears.has(y)).map(async y=>{
    holidayYears.add(y);
    let list=null;
    try{list=JSON.parse(lsGet("kr-holidays-"+y))}catch{}
    if(!list){
      try{
        const r=await fetch(`https://date.nager.at/api/v3/PublicHolidays/${y}/KR`);
        if(r.ok){list=(await r.json()).map(h=>[h.date,h.localName]);lsSet("kr-holidays-"+y,JSON.stringify(list))}
      }catch{}
    }
    (list||[]).forEach(([d,n])=>{if(!KR_HOLIDAYS[d]){KR_HOLIDAYS[d]=n;changed=true}});
  }));
  return changed;
}

// ── 캘린더 컴포넌트 ───────────────────────────
// 선택 모드: o.selected(Set), o.onChange — 클릭으로 토글, PC는 드래그로 연속 선택
// 히트맵 모드: o.heat({날짜:인원}), o.total, o.best(Set), o.onPick
let calDrag=null;
window.addEventListener("pointerup",()=>{calDrag=null});

function mountCalendar(el,o){
  const years=[...new Set(o.months.map(m=>m[0]))];
  if(years.some(y=>!holidayYears.has(y)))loadHolidays(years).then(ch=>{if(ch&&el.isConnected)mountCalendar(el,o)});
  const today=todayStr();
  el.innerHTML=`<div class="cal-wrap">${o.months.map(([y,m])=>{
    const lead=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
    let h="";
    for(let i=0;i<7;i++)h+=`<div class="h${i===0?" sun":i===6?" sat":""}">${W[i]}</div>`;
    for(let i=0;i<lead;i++)h+=`<div class="cell empty"></div>`;
    for(let d=1;d<=days;d++){
      const dt=new Date(y,m,d),ds=ymd(dt),w=dt.getDay(),en=o.isEnabled(ds),hol=KR_HOLIDAYS[ds];
      let cls=`cell${w===0?" sun":w===6?" sat":""}${hol?" hol":""}${ds===today?" today":""}`,
        extra=hol?`<span class="hn" title="${esc(hol)}">${esc(hol)}</span>`:"",attr="";
      if(!en){cls+=" off";attr=" disabled"}
      else if(o.heat){
        const c=o.heat[ds]||0,lv=c?Math.min(4,Math.ceil(c/o.total*4)):0;
        cls+=` h${lv}`;if(o.best?.has(ds))cls+=" best";if(!o.onPick)cls+=" ro";extra+=`<span class="cnt">${c}</span>`;
      }else{
        const on=o.selected.has(ds);if(on)cls+=" on";if(o.readOnly)cls+=" ro";attr=` aria-pressed="${on}"`;
      }
      h+=`<button type="button" class="${cls}" data-d="${ds}"${attr}><span class="num">${d}</span>${extra}</button>`;
    }
    const trail=(7-(lead+days)%7)%7;
    for(let i=0;i<trail;i++)h+=`<div class="cell empty"></div>`;
    return `<div><div class="cal-title">${y}년 ${m+1}월</div><div class="cal">${h}</div></div>`;
  }).join("")}</div>`;

  el.onpointerdown=el.onpointerover=el.onclick=null;
  if(o.heat){
    if(o.onPick)el.onclick=e=>{ // 관리자만: 칸을 누르면 명단 표시
      const c=e.target.closest(".cell[data-d]");if(!c||c.disabled)return;
      el.querySelectorAll(".picked").forEach(x=>x.classList.remove("picked"));c.classList.add("picked");
      o.onPick(c.dataset.d);
    };
    return;
  }
  if(o.readOnly)return;
  const apply=(c,add)=>{const d=c.dataset.d;add?o.selected.add(d):o.selected.delete(d);c.classList.toggle("on",add);c.setAttribute("aria-pressed",add)};
  let lastPtr="";
  el.onpointerdown=e=>{
    lastPtr=e.pointerType;
    const c=e.target.closest(".cell[data-d]");
    if(!c||c.disabled||e.pointerType!=="mouse"||e.button!==0)return;
    e.preventDefault();
    calDrag={add:!o.selected.has(c.dataset.d)};apply(c,calDrag.add);o.onChange();
  };
  el.onpointerover=e=>{
    if(!calDrag)return;
    const c=e.target.closest(".cell[data-d]");
    if(c&&!c.disabled&&o.selected.has(c.dataset.d)!==calDrag.add){apply(c,calDrag.add);o.onChange()}
  };
  el.onclick=e=>{ // 터치·키보드는 click으로 토글 (마우스는 pointerdown에서 이미 처리)
    const c=e.target.closest(".cell[data-d]");if(!c||c.disabled)return;
    if(e.detail!==0&&lastPtr==="mouse")return;
    apply(c,!o.selected.has(c.dataset.d));o.onChange();
  };
}

// ── 데이터 계층: Firebase ─────────────────────
// 일반 사용자와 관리자는 별도 앱 인스턴스(로그인 세션 분리) — 관리자 로그아웃해도 본인 귀속 유지
function firebaseData(fs,db){
  const {doc,collection,onSnapshot,setDoc,addDoc,updateDoc,deleteDoc,getDocs,query,orderBy}=fs;
  const onErr=e=>showError("데이터를 불러오지 못했어요: "+e.message);
  return {
    watchMembers(cb){return onSnapshot(doc(db,"settings","team"),s=>cb(s.exists()?(s.data().members||[]):[]),onErr)},
    saveMembers(members){return setDoc(doc(db,"settings","team"),{members})},
    watchRounds(cb){return onSnapshot(query(collection(db,"rounds"),orderBy("createdAt","desc")),s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),onErr)},
    watchRound(id,cb){return onSnapshot(doc(db,"rounds",id),s=>cb(s.exists()?{id:s.id,...s.data()}:null),onErr)},
    async createRound(data){const r=await addDoc(collection(db,"rounds"),{...data,createdAt:Date.now()});return r.id},
    updateRound(id,patch){return updateDoc(doc(db,"rounds",id),patch)},
    async deleteRound(id){
      const rs=await getDocs(collection(db,"rounds",id,"responses"));
      await Promise.all(rs.docs.map(d=>deleteDoc(d.ref)));
      await deleteDoc(doc(db,"rounds",id));
    },
    // 이름별 PIN 계정 (서버에 확정된 것만 반영)
    watchAccounts(cb){return onSnapshot(collection(db,"accounts"),{includeMetadataChanges:true},
      s=>{const o={};s.docs.forEach(d=>{if(!d.metadata.hasPendingWrites)o[d.id]=d.data()});cb(o)},onErr)},
    resetAccount(name){return deleteDoc(doc(db,"accounts",name))},
    watchResponses(id,cb,onError){return onSnapshot(collection(db,"rounds",id,"responses"),s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());cb(o)},e=>{onErr(e);onError?.(e)})}
  };
}
// 팀원 PIN 로그인: 이름마다 내부용 계정(가상 이메일 + PIN)을 자동으로 만들어 씀 — 팀원은 이름과 PIN만 알면 됨
function rid(){return Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>b.toString(16).padStart(2,"0")).join("")}
function firebaseUserApi(app,fs,au){
  const db=fs.getFirestore(app),auth=au.getAuth(app);
  return {...firebaseData(fs,db),
    onUser(cb){return au.onAuthStateChanged(auth,cb)},
    async register(name,pin){
      const email=`pin-${rid()}@lunch.example.com`;
      const {user}=await au.createUserWithEmailAndPassword(auth,email,pin);
      try{await fs.setDoc(fs.doc(db,"accounts",name),{name,uid:user.uid,email,createdAt:Date.now()})}
      catch(e){try{await au.deleteUser(user)}catch{};await au.signOut(auth).catch(()=>{});throw e}
    },
    async login(email,pin){await au.signInWithEmailAndPassword(auth,email,pin)},
    logout(){return au.signOut(auth)},
    async saveResponse(id,name,picks){
      const u=auth.currentUser;if(!u)throw new Error("로그인이 필요해요");
      await fs.setDoc(fs.doc(db,"rounds",id,"responses",name),{name,uid:u.uid,picks,updatedAt:Date.now()});
    }
  };
}
function firebaseAdminApi(app,fs,au){
  const db=fs.getFirestore(app),auth=au.getAuth(app);
  return {...firebaseData(fs,db),
    onAuth(cb){return au.onAuthStateChanged(auth,cb)},
    login(email,pw){return au.signInWithEmailAndPassword(auth,email,pw)},
    logout(){return au.signOut(auth)}
  };
}

// ── 데이터 계층: 데모(localStorage) ───────────
function localApis(){
  const KEY="lunchpoll-demo4";
  const empty=()=>({members:[],rounds:{},responses:{},accounts:{}});
  const load=()=>{try{return {...empty(),...JSON.parse(localStorage.getItem(KEY))}}catch{return empty()}};
  let state=load();
  const subs=new Set(),notify=()=>subs.forEach(f=>f());
  const save=()=>{lsSet(KEY,JSON.stringify(state));notify()};
  window.addEventListener("storage",e=>{if(e.key===KEY){state=load();notify()}});
  const sub=fn=>{fn();subs.add(fn);return()=>subs.delete(fn)};
  const data={
    watchMembers(cb){return sub(()=>cb(clone(state.members)))},
    async saveMembers(m){state.members=m;save()},
    watchRounds(cb){return sub(()=>cb(Object.entries(state.rounds).map(([id,r])=>({id,...clone(r)})).sort((a,b)=>b.createdAt-a.createdAt)))},
    watchRound(id,cb){return sub(()=>cb(state.rounds[id]?{id,...clone(state.rounds[id])}:null))},
    async createRound(d){const id=Math.random().toString(36).slice(2,10);state.rounds[id]={...d,createdAt:Date.now()};save();return id},
    async updateRound(id,p){Object.assign(state.rounds[id],p);save()},
    async deleteRound(id){delete state.rounds[id];delete state.responses[id];save()},
    watchAccounts(cb){return sub(()=>cb(clone(state.accounts)))},
    async resetAccount(n){delete state.accounts[n];save()},
    watchResponses(id,cb){return sub(()=>cb(clone(state.responses[id]||{})))}
  };
  const UK="lunchpoll-demo-uid";let uid=lsGet(UK);const uSubs=new Set();
  const setUid=v=>{uid=v;try{v?localStorage.setItem(UK,v):localStorage.removeItem(UK)}catch{};uSubs.forEach(f=>f(uid?{uid}:null))};
  const err=c=>Object.assign(new Error(c),{code:c});
  const user={...data,
    onUser(cb){uSubs.add(cb);setTimeout(()=>cb(uid?{uid}:null));return()=>uSubs.delete(cb)},
    async register(name,pin){
      if(state.accounts[name])throw err("permission-denied");
      const u="demo-"+rid();state.accounts[name]={name,uid:u,email:`pin-${rid()}@demo`,createdAt:Date.now(),_pin:pin};save();setUid(u);
    },
    async login(email,pin){
      const a=Object.values(state.accounts).find(x=>x.email===email);
      if(!a||a._pin!==pin)throw err("auth/invalid-credential");setUid(a.uid);
    },
    async logout(){setUid(null)},
    async saveResponse(id,name,picks){if(!uid)throw err("unauthenticated");(state.responses[id]||={})[name]={name,uid,picks,updatedAt:Date.now()};save()}
  };
  let adm=false;try{adm=sessionStorage.getItem("lunchpoll-demo-admin")==="1"}catch{}
  const aSubs=new Set();
  const setAdm=v=>{adm=v;try{sessionStorage.setItem("lunchpoll-demo-admin",v?"1":"0")}catch{};aSubs.forEach(f=>f(v?{email:"demo@admin"}:null))};
  const admin={...data,
    onAuth(cb){aSubs.add(cb);setTimeout(()=>cb(adm?{email:"demo@admin"}:null));return()=>aSubs.delete(cb)},
    async login(){setAdm(true)},
    async logout(){setAdm(false)}
  };
  return {user,admin};
}

// ── 일반: 본인 확인 + 날짜 체크 + 전체 현황 ───
function renderRound(id){
  let round,loaded=false,members=null,responses=null,respErr=false,lastSync=null;
  let sel=new Set(),dirty=false,mineName=null;
  let pinFor=null,pv1="",pv2="",pinErr="",busy=false,focusPin=false;

  const saved=()=>(mineName&&responses)?(responses[mineName]||null):null;
  const resetSel=()=>{sel=new Set(saved()?.picks?.date||[]);dirty=false};
  const ready=()=>loaded&&members!==null&&responses!==null&&ident.ready;
  const touch=()=>{lastSync=Date.now()};

  const status=()=>{
    const el=document.getElementById("st");if(!el)return;
    el.innerHTML=dirty?`<span style="color:var(--warn)">${sel.size}일 선택 · 저장하지 않은 변경이 있어요</span>`
      :saved()?`저장됨 · ${sel.size}일 선택`:`${sel.size}일 선택 · 가능한 날이 없으면 비운 채로 저장하세요`;
  };

  // 전체 다시 그리기 (회차·팀원·신원이 바뀔 때)

    if(!ready())return;
    if(!round){$view.innerHTML=`<div class="card">회차를 찾을 수 없어요. <a href="#/">목록으로</a></div>`;return}

      <div id="mine"></div><div id="status"></div>`;
    drawMine();drawStatus();
  };

    const el=document.getElementById("mine");if(!el)return;
    const me=ident.me,acc=ident.accounts,open=round.status==="open",dates=datesOf(round),cand=new Set(dates);

        <h3>본인 확인</h3>

        ${members.length?`<div class="chips">${members.map(m=>
            `<button class="chip ${m===pinFor?"on":""}" data-act="pick" data-v="${esc(m)}">${esc(m)}${acc[m]?`<span class="lock">🔒</span>`:""}</button>`).join("")}</div>`
          :`<span class="muted">팀원이 아직 등록되지 않았어요.</span>`}
        ${pinFor?`<div class="pinbox">
          <div>${isNew?`<b>${esc(pinFor)}</b>님, 처음이시네요. 앞으로 쓸 PIN 6자리를 정해 주세요.`:`<b>${esc(pinFor)}</b>님의 PIN 6자리를 입력하세요.`}</div>
          <div class="pin-row">
            <input type="password" id="pin1" inputmode="numeric" maxlength="6" autocomplete="${isNew?"new-password":"current-password"}" placeholder="PIN 6자리">
            ${isNew?`<input type="password" id="pin2" inputmode="numeric" maxlength="6" autocomplete="new-password" placeholder="PIN 다시 입력">`:""}
            <button class="btn primary" data-act="pinGo" ${busy?"disabled":""}>${busy?"확인 중…":isNew?"등록":"확인"}</button>
          </div>

            :isNew?"숫자 6자리 · 다른 사이트 비밀번호와 다르게 정하세요":"PIN을 잊었으면 관리자에게 초기화를 요청하세요"}</div>

    </div>`;
    if(!respErr&&s.dates.length){
      mountCalendar(document.getElementById("heat"),{
        months:monthsBetween(s.dates[0],s.dates[s.dates.length-1]),isEnabled:d=>cand.has(d),
        heat:s.heat,total:Math.max(s.rows.length,1),best:s.best
      });
    }
  };

  handlers={
    pick:el=>{if(busy)return;pinFor=el.dataset.v;pv1=pv2=pinErr="";focusPin=true;drawMine()},
    pinGo:async()=>{
      if(busy||!pinFor)return;
      const name=pinFor,a=ident.accounts[name],p1=pv1.trim(),p2=pv2.trim();
      if(!/^\d{6}$/.test(p1)){pinErr="PIN은 숫자 6자리예요";focusPin=true;return drawMine()}
      if(!a&&p1!==p2){pinErr="두 PIN이 서로 달라요";pv2="";return drawMine()}
      busy=true;pinErr="";drawMine();
      try{
        if(a)await userApi.login(a.email,p1);else await userApi.register(name,p1);
        pinFor=null;pv1=pv2="";
        toast(a?`${name}님 확인됐어요`:`${name}님 PIN을 등록했어요`);
      }catch(e){
        const c=e.code||"";
        pinErr=/wrong-password|invalid-credential|user-not-found|invalid-login/.test(c)?"PIN이 맞지 않아요"
          :/too-many-requests/.test(c)?"틀린 시도가 많아 잠시 막혔어요. 몇 분 뒤 다시 해 주세요"
          :/operation-not-allowed/.test(c)?"Firebase에서 이메일/비밀번호 로그인이 꺼져 있어요. 관리자에게 알려주세요"
          :/permission-denied/.test(c)?"등록하지 못했어요. 방금 다른 사람이 이 이름을 등록했을 수 있어요"
          :/network/.test(c)?"네트워크 오류예요. 잠시 뒤 다시 해 주세요"
          :`확인하지 못했어요 (${c||e.message})`;
        pv1=pv2="";focusPin=true;
      }finally{busy=false;if(!ident.me)drawMine()}
    },
    all:()=>{datesOf(round).forEach(d=>sel.add(d));dirty=true;drawMine()},
    none:()=>{sel.clear();dirty=true;drawMine()},
    save:async()=>{
      try{await userApi.saveResponse(id,ident.me,{date:[...sel].sort()});dirty=false;toast("저장했어요");drawMine()}
      catch(e){toast("저장하지 못했어요. 마감됐거나 PIN이 초기화됐을 수 있어요. 다시 로그인해 주세요.")}
    },
    refresh:()=>{
      if(dirty&&!confirm("저장하지 않은 변경이 있어요. 새로고침하면 사라져요. 계속할까요?"))return;
      location.reload();
    }
  };

  const onIdent=()=>{
    const name=ident.me||null;
    if(name!==mineName){mineName=name;resetSel()}
    draw();
  };
  ident.subs.add(onIdent);
  unsubs.push(
    ()=>ident.subs.delete(onIdent),
    userApi.watchRound(id,r=>{round=r;loaded=true;touch();draw()}),
    userApi.watchMembers(m=>{members=m;touch();draw()}),
    userApi.watchResponses(id,r=>{
      responses=r;respErr=false;touch();
      if(!document.getElementById("status")){if(!dirty)resetSel();draw();return}
      // 내가 편집 중이면 내 캘린더는 그대로 두고 현황만 갱신
      if(!dirty&&ident.me){resetSel();drawMine()}
      drawStatus();
    },()=>{responses={};respErr=true;draw()})
  );
  onIdent();
}

// ── 관리자: 로그인 ────────────────────────────
function adminGate(render){

  if(adminUser){render();return}
  $view.innerHTML=`
    <div class="card" style="max-width:400px;margin:32px auto">
      <h2>관리자 로그인</h2>
      <div class="sub">회차 생성과 전체 응답 확인은 관리자만 할 수 있어요.</div>
      ${DEMO?`<div class="mt"><button class="btn primary" data-act="login">데모 관리자로 로그인</button></div>`:`
        <label class="f">이메일</label><input type="email" id="em" autocomplete="username">
        <label class="f">비밀번호</label><input type="password" id="pw" autocomplete="current-password">
        <div class="mt"><button class="btn primary" data-act="login">로그인</button></div>`}

  document.getElementById("pw")?.addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
}

// ── 관리자: 회차 목록 ─────────────────────────
function renderAdminHome(){
  let rounds=[],members=[],counts={},countSubs={};
  $view.innerHTML=`
    <div class="card"><div class="row between">
      <div><h2>회차</h2><div class="sub">회차를 만들고 전체 응답을 확인해요.</div></div>
      <a class="btn primary" href="#/admin/new">+ 새 회차</a>
    </div></div>
    <div class="card" id="roundList"></div>`;
  const drawRounds=()=>{
    document.getElementById("roundList").innerHTML=rounds.length?rounds.map(r=>`
      <div class="ritem">
        <div>
          <a href="#/admin/r/${encodeURIComponent(r.id)}"><b>${esc(r.title)}</b></a>${badge(r)}
          <div class="sub">${esc(dateSummary(r))} · 응답 ${counts[r.id]??"-"}/${members.length}</div>
        </div>
        <div class="row">
          <a class="btn sm" href="#/admin/r/${encodeURIComponent(r.id)}">결과 보기</a>
          <button class="btn sm" data-act="copyMail" data-id="${esc(r.id)}">메일 문구</button>
          <button class="btn sm" data-act="toggleStatus" data-id="${esc(r.id)}">${r.status==="open"?"마감":"재개"}</button>
          <button class="btn sm danger" data-act="del" data-id="${esc(r.id)}">삭제</button>
        </div>
      </div>`).join(""):`<span class="muted">아직 회차가 없어요. 오른쪽 위 '+ 새 회차'로 만들어 주세요.</span>`;
  };
  const syncCounts=()=>{
    const ids=new Set(rounds.map(r=>r.id));
    for(const id of Object.keys(countSubs))if(!ids.has(id)){countSubs[id]();delete countSubs[id]}
    for(const id of ids)if(!countSubs[id])countSubs[id]=adminApi.watchResponses(id,r=>{counts[id]=Object.keys(r).length;drawRounds()});
  };
  const find=el=>rounds.find(x=>x.id===el.dataset.id);
  handlers={
    copyMail:el=>copy(mailText(find(el))),
    toggleStatus:async el=>{const r=find(el);await adminApi.updateRound(r.id,{status:r.status==="open"?"closed":"open"})},
    del:async el=>{const r=find(el);if(confirm(`'${r.title}' 회차와 응답을 모두 삭제할까요?`)){await adminApi.deleteRound(r.id);toast("삭제했어요")}}
  };
  unsubs.push(
    adminApi.watchMembers(m=>{members=m;drawRounds()}),
    adminApi.watchRounds(r=>{rounds=r;syncCounts();drawRounds()}),
    ()=>Object.values(countSubs).forEach(u=>u())
  );
}

// ── 관리자: 새 회차 ───────────────────────────
function renderAdminNew(){
  const t=new Date();let base=[t.getFullYear(),t.getMonth()],sel=new Set(),titleTouched=false;
  $view.innerHTML=`
    <div class="card"><h2>새 회차 만들기</h2><div class="sub">후보 날짜를 고르면 팀원이 그중 가능한 날을 체크해요.</div></div>
    <div class="card">
      <label class="f" style="margin-top:0">제목</label>
      <input type="text" id="title">
      <label class="f">후보 날짜 <b id="cnt"></b></label>
      <div class="row" style="margin-bottom:12px">
        <button class="btn sm" data-act="quick" data-q="rest">이번 주 남은 평일</button>
        <button class="btn sm" data-act="quick" data-q="next">다음 주 평일</button>
        <button class="btn sm" data-act="quick" data-q="two">다음 2주 평일</button>
        <button class="btn sm" data-act="quick" data-q="month">다음 달 평일</button>
        <button class="btn sm" data-act="clear">비우기</button>
      </div>
      <div class="sub" style="margin-bottom:10px">칸을 눌러 후보 날짜를 고르세요. PC에서는 드래그로 여러 날을 한 번에 칠할 수 있어요. 빠른 선택 버튼은 주말·공휴일을 자동으로 빼요.</div>
      <div class="row between" style="margin-bottom:8px">
        <button class="btn sm" data-act="prev">◀ 이전 달</button>
        <button class="btn sm" data-act="next">다음 달 ▶</button>
      </div>
      <div id="cal"></div>
      <div class="row mt"><button class="btn primary" data-act="create">회차 만들기</button></div>
    </div>`;
  const titleEl=document.getElementById("title"),calEl=document.getElementById("cal"),today=todayStr();
  titleEl.addEventListener("input",()=>{titleTouched=true});
  const update=()=>{
    document.getElementById("cnt").textContent=sel.size?`· ${sel.size}일 선택`:"";
    if(!titleTouched){const f=[...sel].sort()[0];titleEl.value=`${f?+f.slice(5,7):t.getMonth()+1}월 팀점심`}
  };
  const drawCal=()=>{
    const [y,m]=base,n=new Date(y,m+1,1);
    mountCalendar(calEl,{months:[[y,m],[n.getFullYear(),n.getMonth()]],isEnabled:d=>d>=today,selected:sel,onChange:update});
    update();
  };
  const monday=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+((8-d.getDay())%7||7));return d};
  const shift=k=>{const d=new Date(base[0],base[1]+k,1);base=[d.getFullYear(),d.getMonth()];drawCal()};
  handlers={
    prev:()=>shift(-1),next:()=>shift(1),
    clear:()=>{sel.clear();drawCal()},
    quick:async el=>{
      const q=el.dataset.q;let s,e;
      if(q==="rest"){s=new Date();s.setDate(s.getDate()+1);e=new Date();e.setDate(e.getDate()+(5-e.getDay()))}
      else if(q==="month"){s=new Date(t.getFullYear(),t.getMonth()+1,1);e=new Date(t.getFullYear(),t.getMonth()+2,0)}
      else{s=monday();e=new Date(s);e.setDate(e.getDate()+(q==="next"?4:11))}
      await loadHolidays([...new Set([s.getFullYear(),e.getFullYear()])]);
      weekdays(s,e).forEach(d=>sel.add(d));
      const f=[...sel].sort()[0];if(f){const d=parseYmd(f);base=[d.getFullYear(),d.getMonth()]}
      drawCal();
    },
    create:async()=>{
      const title=titleEl.value.trim();
      if(!title)return toast("제목을 입력하세요");
      if(!sel.size)return toast("후보 날짜를 골라 주세요");
      try{const id=await adminApi.createRound({title,status:"open",items:{date:[...sel].sort()}});location.hash=`#/admin/r/${encodeURIComponent(id)}`}
      catch(e){toast("생성 실패: "+e.message)}
    }
  };
  drawCal();
}

// ── 관리자: 결과 ──────────────────────────────
function renderAdminRound(id){
  let round,loaded=false,members=[],responses={},picked=null,lastSync=null;
  const touch=()=>{lastSync=Date.now()};

  const drawPick=()=>{
    const el=document.getElementById("pick");if(!el)return;
    if(!picked){el.innerHTML="";return}
    const yes=[],no=[];
    for(const r of Object.values(responses))((r.picks?.date||[]).includes(picked)?yes:no).push(r.name);
    const pending=members.filter(m=>!responses[m]);
    el.innerHTML=`<b>${fmtDate(picked)}</b> — 가능 ${yes.length}명: ${esc(yes.join(", "))||"-"}<br>
      <span class="sub">불가: ${esc(no.join(", "))||"-"} · 미응답: ${esc(pending.join(", "))||"-"}</span>`;
  };

  const draw=()=>{
    if(!loaded)return;
    if(!round){$view.innerHTML=`<div class="card">회차를 찾을 수 없어요. <a href="#/admin">회차 목록으로</a></div>`;return}
    const s=summarize(round,members,responses),cand=new Set(s.dates),open=round.status==="open";
    $view.innerHTML=`
      <div class="card">
        <div class="row between">
          <div><h2>${esc(round.title)}${badge(round)}</h2><div class="sub">${esc(dateSummary(round))}</div></div>
          <div class="row">
            <button class="btn sm" data-act="copyLink">응답 링크 복사</button>
            <button class="btn sm" data-act="copyMail">메일 문구 복사</button>
            <button class="btn sm" data-act="toggleStatus">${open?"마감하기":"재개하기"}</button>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="row between" style="margin-bottom:12px">
          <h3 style="margin:0">요약</h3>
          <div class="row"><span class="sub">${syncText(lastSync)}</span><button class="btn sm" data-act="refresh">↻ 새로고침</button></div>
        </div>
        <div class="stats">
          <div class="stat"><div class="sub">응답</div><div class="big">${s.responded} / ${members.length}명</div></div>
          <div class="stat"><div class="sub">최다 가능일</div>
            <div class="big">${topText(s)}</div>
            ${s.top.length>1?`<div class="sub">${s.top.slice(1).map(d=>`${fmtDate(d)} ${s.heat[d]}명`).join(" / ")}</div>`:""}
          </div>
        </div>
        <div class="sub mt">미응답: ${esc(s.pending.join(", "))||"없음 🎉"}</div>
      </div>
      <div class="card">
        <div class="row between" style="margin-bottom:10px">
          <h3 style="margin:0">캘린더</h3>
          <div class="legend">적음 <i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i> 많음 · ★ 최다</div>
        </div>
        <div class="sub" style="margin-bottom:10px">칸의 숫자는 가능 인원이에요. 칸을 누르면 명단이 보여요.</div>
        <div id="cal"></div>
        <div class="pick" id="pick"></div>
      </div>
      <div class="card"><h3>응답표</h3>${matrixHtml(s,responses,null)}</div>`;
    if(s.dates.length){
      mountCalendar(document.getElementById("cal"),{
        months:monthsBetween(s.dates[0],s.dates[s.dates.length-1]),isEnabled:d=>cand.has(d),
        heat:s.heat,total:Math.max(s.rows.length,1),best:s.best,onPick:d=>{picked=d;drawPick()}
      });
      if(picked)document.querySelector(`.cell[data-d="${picked}"]`)?.classList.add("picked");
    }
    drawPick();
  };

  handlers={
    copyLink:()=>copy(roundUrl(id)),
    copyMail:()=>copy(mailText(round)),
    toggleStatus:()=>adminApi.updateRound(id,{status:round.status==="open"?"closed":"open"}),
    refresh:()=>location.reload()
  };
  unsubs.push(
    adminApi.watchRound(id,r=>{round=r;loaded=true;touch();draw()}),
    adminApi.watchMembers(m=>{members=m;touch();draw()}),
    adminApi.watchResponses(id,r=>{responses=r;touch();draw()})
  );
}

// ── 관리자: 팀원 + 본인 확인 현황 ─────────────
function renderAdminMembers(){
  let members=[],accounts={},dirty=false;
  $view.innerHTML=`
    <div class="card"><h2>팀원</h2><div class="sub">응답할 수 있는 이름과 본인 확인 현황을 관리해요.</div></div>
    <div class="card">
      <h3>팀원 목록</h3>
      <div class="sub" style="margin-bottom:8px">한 줄에 한 명씩 입력하세요. 순서대로 표시돼요.</div>
      <textarea id="membersTa" placeholder="홍길동&#10;김철수"></textarea>
      <div class="row mt"><button class="btn primary" data-act="saveMembers">팀원 저장</button><span class="sub" id="memberCount"></span></div>
    </div>
    <div class="card">
      <h3>PIN 등록 현황</h3>
      <div class="sub" style="margin-bottom:14px">팀원은 이름 + PIN 6자리로 본인 확인을 해요. PIN을 잊었거나 다른 사람이 잘못 등록했으면 초기화하세요. 기존 응답은 유지되고, 다음 접속 때 PIN을 새로 정해요.</div>
      <div id="claimList"></div>
    </div>`;
  const ta=document.getElementById("membersTa");
  ta.addEventListener("input",()=>{dirty=true});
  const drawMembers=()=>{
    if(!dirty)ta.value=members.join("\n");
    document.getElementById("memberCount").textContent=`현재 ${members.length}명`;
  };
  const drawClaims=()=>{
    const names=[...members,...Object.keys(accounts).filter(n=>!members.includes(n))];
    document.getElementById("claimList").innerHTML=names.length?names.map(n=>{const c=accounts[n];
      return `<div class="ritem">
        <div><b>${esc(n)}</b>${members.includes(n)?"":` <span class="sub">(팀원 목록에 없음)</span>`}
          <div class="sub">${c?`<span class="ok">● PIN 등록됨</span> · ${fmtDT(c.createdAt)}`:"○ 아직 PIN 미등록"}</div></div>
        ${c?`<button class="btn sm danger" data-act="reset" data-v="${esc(n)}">PIN 초기화</button>`:""}
      </div>`}).join(""):`<span class="muted">팀원을 먼저 등록하세요.</span>`;
  };
  handlers={
    saveMembers:async()=>{
      const list=[...new Set(ta.value.split("\n").map(s=>s.replace(/\//g,"").trim()).filter(Boolean))];
      try{await adminApi.saveMembers(list);dirty=false;toast("팀원을 저장했어요")}
      catch(e){toast("저장 실패: "+e.message)}
    },
    reset:async el=>{
      const n=el.dataset.v;
      if(!confirm(`'${n}'의 PIN을 초기화할까요?\n\n기존 응답은 유지되고, 다음 접속 때 PIN을 새로 정해요.`))return;
      try{await adminApi.resetAccount(n);toast("초기화했어요")}catch(e){toast("초기화 실패: "+e.message)}
    }
  };
  unsubs.push(
    adminApi.watchMembers(m=>{members=m;drawMembers();drawClaims()}),
    adminApi.watchAccounts(c=>{accounts=c;drawClaims()})
  );
}

// ── 시작 ──────────────────────────────────────
(async()=>{
  try{
    if(DEMO){
      const l=localApis();userApi=l.user;adminApi=l.admin;
      document.getElementById("banner").innerHTML=`<div class="banner">데모 모드: 데이터가 이 브라우저에만 저장돼요. <button class="linkbtn" id="demoSwitch">로그아웃(다른 사람으로 테스트)</button></div>`;
      document.getElementById("demoSwitch").onclick=()=>{userApi.logout();toast("로그아웃했어요")};
    }else{
      const V="10.12.2",B=`https://www.gstatic.com/firebasejs/${V}`;
      const [{initializeApp},fs,au]=await Promise.all([import(`${B}/firebase-app.js`),import(`${B}/firebase-firestore.js`),import(`${B}/firebase-auth.js`)]);
      userApi=firebaseUserApi(initializeApp(firebaseConfig),fs,au);
      adminApi=firebaseAdminApi(initializeApp(firebaseConfig,"admin"),fs,au);
    }
    userApi.onUser(u=>{ident.uid=u?u.uid:null;identChanged()});
    userApi.watchAccounts(c=>{ident.accounts=c;identChanged()});
    adminApi.onAuth(u=>{
      adminUser=u;adminReady=true;
      if((location.hash||"").startsWith("#/admin"))route();else drawHeader();
    });
    window.addEventListener("hashchange",route);
    route();
  }catch(e){
    showError("Firebase에 연결하지 못했어요. 네트워크에서 차단됐거나 설정값이 잘못됐을 수 있어요. ("+e.message+")");
  }
})();
